<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Performa · Probationary Performance Management</title>
    <!-- Pre-paint script: prevents theme flash before React mounts -->
    <script>
      (function() {
        try {
          var p = localStorage.getItem("performa-palette");
          if (/^(midnight|dusk|paper|mist|sage)$/.test(p)) {
            document.documentElement.setAttribute("data-theme", p);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
